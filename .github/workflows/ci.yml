# Lints the library with arduino-lint, runs host tests, and compiles
# examples against Arduino-ESP32 on every push and PR to main.
#
# compile-cores covers core 2.0.17 (ESP32, S2, S3, C3) and core 3.3.0
# (those plus C5, C6, H2, P4). One sketch per cell is enough to compile
# the library. CompileCheck does not include WiFi.h, because the H2 has no
# Wi-Fi radio. Core 3.3.0's prebuilt libs package has no esp32c2 folder, so
# that board's bootloader ELF is not shipped and this matrix does not build
# it. The latest-core job still compiles every example on the original ESP32.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Arduino lint (strict, library-manager update)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/arduino-lint-action@v2
        with:
          project-type: library
          library-manager: update
          compliance: strict

  native-test:
    name: Host unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and run host tests
        run: |
          cc  -std=c99   -Wall -Wextra -Isrc -c src/monocypher.c src/monocypher-ed25519.c
          g++ -std=c++11 -Wall -Wextra -Isrc -o test_native \
              test/native/test_native.cpp src/SimpleOTASigning.cpp \
              monocypher.o monocypher-ed25519.o
          ./test_native

  compile:
    name: Compile examples (latest ESP32 core)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile sketches
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          libraries: |
            - source-path: ./
          enable-deltas-report: true
          sketches-report-path: sketches-reports

      - name: Upload sketches report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sketches-reports
          path: sketches-reports

  compile-cores:
    name: Compile BasicOTA (${{ matrix.version }} ${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "2.0.17"
            board: esp32
          - version: "2.0.17"
            board: esp32s2
          - version: "2.0.17"
            board: esp32s3
          - version: "2.0.17"
            board: esp32c3
          - version: "3.3.0"
            board: esp32
          - version: "3.3.0"
            board: esp32s2
          - version: "3.3.0"
            board: esp32s3
          - version: "3.3.0"
            board: esp32c3
          - version: "3.3.0"
            board: esp32c5
          - version: "3.3.0"
            board: esp32c6
          - version: "3.3.0"
            board: esp32h2
          - version: "3.3.0"
            board: esp32p4

    steps:
      - uses: actions/checkout@v4

      - name: Compile BasicOTA
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:${{ matrix.board }}
          platforms: |
            - name: esp32:esp32
              version: ${{ matrix.version }}
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples/CompileCheck

  verify-rollback-symbol:
    name: verifyRollbackLater comes from the library
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Compile and check the strong symbol
        run: |
          set -euo pipefail
          arduino-cli config init || true
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.0
          arduino-cli compile --fqbn esp32:esp32:esp32 \
            --library "$PWD" \
            --build-path "$PWD/build" \
            examples/BasicOTA/BasicOTA.ino
          obj=$(find build -name 'SimpleOTAClient.cpp.o' | head -1)
          test -n "$obj"
          echo "object: $obj"
          NM=$(find "$HOME/.arduino15/packages/esp32" -type f \( \
            -name 'xtensa-esp32-elf-nm' -o -name 'xtensa-esp-elf-nm' \) | head -1)
          test -n "$NM"
          echo "nm: $NM"
          "$NM" "$obj" | tee /tmp/sota-nm.txt
          grep -E ' T verifyRollbackLater$' /tmp/sota-nm.txt
