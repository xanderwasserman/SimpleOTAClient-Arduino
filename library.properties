name=SimpleOTAClient
version=1.0.0
author=SimpleOTA <support@simpleota.com>
maintainer=SimpleOTA <support@simpleota.com>
sentence=Thin Arduino-ESP32 client for the SimpleOTA firmware update platform.
paragraph=The same C API as the SimpleOTA ESP-IDF component (simpleota.h). Checks for updates, streams and flashes firmware with on-the-fly SHA-256 and Ed25519 signature verification, runs each new image as a trial that rolls back unless confirmed, refuses downgrades, and reports lifecycle events. Works over any network: the sketch owns Wi-Fi or Ethernet bring-up.
category=Communication
url=https://github.com/wassie-dev/simpleOTAClient-Arduino
architectures=esp32
includes=simpleota.h
license=MIT
